name: Deploy production

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure production
        env:
          WRANGLER_CONFIG: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const config = JSON.parse(process.env.WRANGLER_CONFIG);
          const mask = value => {
            if (typeof value === 'string' && value) {
              console.log(`::add-mask::${value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
            } else if (value && typeof value === 'object') {
              Object.values(value).forEach(mask);
            }
          };
          mask(config);
          // CI builds explicitly before migrations; skip Wrangler's custom rebuild.
          delete config.build;
          assert(config.vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY.startsWith('pk_'));
          const vars = Object.entries(config.vars).map(([key, value]) => {
            assert(/^[A-Z][A-Z0-9_]*$/.test(key) && typeof value === 'string' && !/[\r\n]/.test(value));
            return `${key}=${value}\n`;
          }).join('');
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config));
          fs.appendFileSync(process.env.GITHUB_ENV, vars);
          NODE
      - run: pnpm run lint
      - name: Build production Worker
        run: pnpm exec opennextjs-cloudflare build
      - name: Migrate production database
        run: pnpm run db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Worker
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
