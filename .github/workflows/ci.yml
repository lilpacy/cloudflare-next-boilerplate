name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # `next build` only needs a well-formed publishable key to prerender; the
      # output is never deployed, so a placeholder avoids wiring a repository
      # variable. Deploy workflows pass the real key from the Wrangler config.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:run
      # Nx hides task logs in non-TTY output unless the output style is static,
      # so call nx directly instead of `pnpm run build -- ...`, which would
      # forward the flag to `next build`.
      - run: pnpm exec nx build web --output-style=static

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Clerk test (development) instance shared with the preview environment.
      # D1/R2 stay in the runner's local Wrangler state, so no Cloudflare
      # credentials are needed. Secrets are not passed to fork pull requests,
      # so this job fails there at global setup.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: apps/web/test-results

  storybook:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cf-next/ui exec playwright install --with-deps chromium
      - run: pnpm exec nx run ui:storybook:build --output-style=static
      - run: pnpm exec nx run ui:storybook:test --output-style=static
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          if-no-files-found: error
